[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-vision-engine"
version = "0.1.0"
description = "Local modular visual perception, licensed image benchmarks, and detection films"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-only"
dependencies = ["ultralytics>=8.4,<9", "opencv-python>=4.10", "numpy>=1.26", "Pillow>=10", "pydantic>=2.9", "psutil>=6", "PyYAML>=6", "lap>=0.5"]

[project.optional-dependencies]
ocr = ["easyocr>=1.7"]
scene = ["transformers>=4.48,<6", "safetensors>=0.5"]
face = ["mediapipe>=0.10"]
export = ["onnxruntime>=1.20", "onnx>=1.17"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
ai-vision = "ai_vision.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads weights and runs actual inference"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/ai_vision"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
